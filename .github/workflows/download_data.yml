name: Descargar datos de mercado

# Lanzamiento manual (pestaña Actions → "Run workflow") o desde la sesión de Claude.
# Descarga velas 15m/1h/4h/1d de Binance (data.binance.vision, público), funding de
# perpetuos, cruza con Kraken, valida, genera las fichas de mercado (Fase 1) y sube al
# repositorio los Parquet de 1h/4h/1d, los informes de validación y el informe de mercado.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Mes inicial YYYY-MM"
        default: "2017-08"
      intervals:
        description: "Intervalos a descargar"
        default: "15m 1h 4h 1d"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: trading_bot/requirements.txt

      - run: pip install -r trading_bot/requirements.txt

      - name: Velas spot
        run: python -m trading_bot.data.binance_vision --markets spot --intervals ${{ github.event.inputs.intervals }} --start ${{ github.event.inputs.start }}

      - name: Perpetuos y funding (BTC, ETH)
        run: python -m trading_bot.data.binance_vision --markets futures funding --symbols BTCUSDT ETHUSDT --intervals 1h 4h 1d --start 2019-09

      - name: Contraste con Kraken
        run: python -m trading_bot.data.kraken

      - name: Fichas de mercado (Fase 1)
        run: python -m trading_bot.research.market_profile

      - name: Tamaño de lo que se sube
        run: du -sh data_store/parquet && git add -n data_store research | wc -l

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_store research/reports
          git commit -m "Datos de mercado y fichas de Fase 1 ($(date -u +%Y-%m-%d))" || { echo "sin cambios"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
